databases:
  - name: confiapix-db
    plan: basic-256mb
    postgresMajorVersion: "16"
    databaseName: confiapix
    user: confiapix

services:
  - type: web
    name: confiapix-api
    runtime: docker
    plan: starter
    rootDir: confiapix
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: confiapix-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_SECRET
        generateValue: true
      - key: STONE_SANDBOX
        value: "true"
      - key: STONE_SYNC_JOB_ENABLED
        value: "true"
      - key: JAVA_OPTS
        value: "-XX:MaxRAMPercentage=75.0 -XX:+UseG1GC"

  - type: web
    name: confiapix-frontend
    runtime: docker
    plan: starter
    rootDir: confiapix-frontend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: API_UPSTREAM
        fromService:
          name: confiapix-api
          type: web
          property: hostport

  - type: web
    name: confiapix-website
    runtime: static
    rootDir: confiapix-website
    staticPublishPath: .
