databases:
  - name: confiapix-db
    plan: free
    postgresMajorVersion: "16"
    databaseName: confiapix
    user: confiapix

services:
  - type: web
    name: confiapix-api
    runtime: docker
    plan: free
    rootDir: confiapix
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: confiapix-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_SECRET
        generateValue: true
      - key: STONE_SANDBOX
        value: "true"
      - key: STONE_SYNC_JOB_ENABLED
        value: "false"
      - key: JAVA_OPTS
        value: "-XX:MaxRAMPercentage=75.0 -XX:+UseG1GC"

  - type: web
    name: confiapix-frontend
    runtime: docker
    plan: free
    rootDir: confiapix-frontend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # Serviço free não recebe rede privada; o nginx chama a URL pública da API.
      # Se o Render adicionar um sufixo na URL, ajuste esta variável no dashboard.
      - key: API_UPSTREAM
        value: https://confiapix-api.onrender.com

  - type: web
    name: confiapix-website
    runtime: static
    rootDir: confiapix-website
    staticPublishPath: .
