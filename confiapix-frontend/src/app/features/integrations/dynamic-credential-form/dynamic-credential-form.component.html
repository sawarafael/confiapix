<form [formGroup]="form()" class="credentials-form">
  @for (section of sections(); track section.title ?? 'default') {
    <section class="form-panel">
      @if (section.title) {
        <header class="form-panel__head">
          <span class="form-panel__icon material-symbols-outlined">{{ sectionIcon(section.title) }}</span>
          <h3>{{ section.title }}</h3>
        </header>
      }

      <div class="form-panel__grid">
        @for (field of section.fields; track field.name) {
          <div class="form-field" [class.form-field--full]="field.fullWidth">
            <label [attr.for]="field.name">
              <span class="form-field__label">
                {{ field.label }}
                @if (field.required) {
                  <span class="form-field__required" aria-hidden="true">*</span>
                }
              </span>

              @switch (field.type) {
                @case ('select') {
                  <div class="form-field__control">
                    <select [id]="field.name" [formControlName]="field.name">
                      @for (option of field.options ?? []; track option.value) {
                        <option [value]="option.value">{{ option.label }}</option>
                      }
                    </select>
                  </div>
                }
                @case ('password') {
                  <div class="form-field__control">
                    <input
                      [id]="field.name"
                      type="password"
                      [formControlName]="field.name"
                      [placeholder]="field.placeholder ?? ''"
                      autocomplete="off"
                    />
                  </div>
                }
                @case ('textarea') {
                  <div class="form-field__control form-field__control--code">
                    <textarea
                      [id]="field.name"
                      [formControlName]="field.name"
                      [placeholder]="field.placeholder ?? ''"
                      rows="5"
                      spellcheck="false"
                    ></textarea>
                  </div>
                }
                @default {
                  <div class="form-field__control">
                    <input
                      [id]="field.name"
                      type="text"
                      [formControlName]="field.name"
                      [placeholder]="field.placeholder ?? ''"
                      [attr.inputmode]="field.name === 'companyDocument' ? 'numeric' : null"
                    />
                  </div>
                }
              }

              @if (field.helpText) {
                <p class="form-field__help">{{ field.helpText }}</p>
              }
              @if (secretOptionalHint() && field.name === 'clientSecret') {
                <p class="form-field__hint">Deixe em branco apenas se não for alterar a chave atual.</p>
              }
            </label>
          </div>
        }
      </div>
    </section>
  }
</form>
