<div class="auth">
  <div class="auth__blobs" aria-hidden="true"></div>
  <div class="auth__card">
    <div class="auth__brand">
      <img class="auth__logo" src="logo.png" alt="ConfiaPix" width="56" height="56" />
      <h1>ConfiaPix</h1>
      <p>Painel administrativo</p>
    </div>

    @if (error()) {
      <div class="alert">{{ error() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>
        E-mail
        <input type="email" formControlName="email" placeholder="admin@empresa.com" />
      </label>
      <label>
        Senha
        <input type="password" formControlName="password" placeholder="••••••••" />
      </label>
      <button class="btn btn--primary" type="submit" [disabled]="loading()">
        {{ loading() ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>
  </div>
</div>
