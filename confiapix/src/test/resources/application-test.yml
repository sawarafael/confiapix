spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration
  datasource:
    url: jdbc:h2:mem:confiapix;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

confiapix:
  stone:
    sync-job-enabled: false
  encryption:
    secret: test-encryption-secret-for-unit-tests-32chars-minimum
  jwt:
    secret: test-secret-key-for-unit-tests-min-256-bits-long-enough-value
    expiration-ms: 3600000
    refresh-expiration-ms: 7200000
